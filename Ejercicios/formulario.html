<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #f4f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 36px 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }

    h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
      color: #1a1a1a;
    }

    .campo {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #444;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: #6E3BFF; }

    input.invalido { border-color: #E24B4A; background: #fff8f8; }

    .msg-error {
      display: none;
      font-size: 12px;
      color: #A32D2D;
      margin-top: 5px;
      padding: 6px 10px;
      background: #FCEBEB;
      border-radius: 6px;
      border-left: 3px solid #E24B4A;
    }

    .msg-error.visible { display: block; }

    button {
      width: 100%;
      padding: 12px;
      background: #6E3BFF;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    button:hover { background: #534AB7; }

    .banner {
      display: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      margin-top: 16px;
      text-align: center;
    }

    .banner.exito {
      display: block;
      background: #E1F5EE;
      color: #0F6E56;
      border: 1px solid #5DCAA5;
    }

    .banner.error-general {
      display: block;
      background: #FCEBEB;
      color: #A32D2D;
      border: 1px solid #F09595;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Registro de usuario</h2>

    <div class="campo">
      <label>Nombre</label>
      <input id="nombre" placeholder="Tu nombre completo">
      <div class="msg-error" id="err-nombre"></div>
    </div>

    <div class="campo">
      <label>Email</label>
      <input id="email" placeholder="correo@ejemplo.com">
      <div class="msg-error" id="err-email"></div>
    </div>

    <div class="campo">
      <label>Edad</label>
      <input id="edad" placeholder="Entre 18 y 65">
      <div class="msg-error" id="err-edad"></div>
    </div>

    <div class="campo">
      <label>Sueldo</label>
      <input id="sueldo" placeholder="Valor en pesos">
      <div class="msg-error" id="err-sueldo"></div>
    </div>

    <button onclick="enviar()">Registrar</button>
    <div class="banner" id="banner"></div>
  </div>

  <script>
    function limpiar() {
      ['nombre', 'email', 'edad', 'sueldo'].forEach(campo => {
        document.getElementById(campo).classList.remove('invalido')
        const err = document.getElementById('err-' + campo)
        err.textContent = ''
        err.classList.remove('visible')
      })
      const banner = document.getElementById('banner')
      banner.className = 'banner'
      banner.textContent = ''
    }

    async function enviar() {
      limpiar()

      const datos = {
        nombre: document.getElementById('nombre').value,
        email:  document.getElementById('email').value,
        edad:   document.getElementById('edad').value,
        sueldo: document.getElementById('sueldo').value,
      }

      const respuesta = await fetch('http://localhost:5000/validar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      })

      const resultado = await respuesta.json()
      const banner = document.getElementById('banner')

      if (resultado.ok) {
        banner.className = 'banner exito'
        banner.textContent = '✓ ' + resultado.mensaje
      } else {
        // Mostrar cada error debajo de su campo
        Object.entries(resultado.errores).forEach(([campo, msg]) => {
          const input = document.getElementById(campo)
          const err   = document.getElementById('err-' + campo)
          if (input) input.classList.add('invalido')
          if (err)   { err.textContent = msg; err.classList.add('visible') }
        })
        banner.className = 'banner error-general'
        banner.textContent = 'Corrige los errores antes de continuar'
      }
    }
  </script>
</body>
</html>
